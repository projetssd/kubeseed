---
application: 'jinjaparser'
app_port: 8125
description: "Jinja Parser"
image: 'tautulli/tautulli'
application_volumes:
  - local_path: "{{ lookup('env','HOME') }}"
    container_path: "{{ lookup('env','HOME') }}"

application_env:
  - name: PUID
    value: '{{user.userid}}'
  - name: PGID
    value: '{{user.groupid}}'
  - name: TZ
    value: 'Europe/Paris'
